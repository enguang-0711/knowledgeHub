lass="iso-fill" d="M591 361.2L591.1 361L591.3 360.9L591.6 360.8L591.9 360.8L592.2 360.9L592.4 361L592.6 361.1L592.6 361.3L592.6 361.6L592.5 361.8L592.3 361.9L592.1 362L591.8 362L591.5 362L591.2 361.9L591.1 361.7L591 361.6Z"/><path class="iso-shade" data-shade="0" d="M592.6 361.6L592.5 361.8L592.5 361.4L592.6 361.3ZM592.5 361.8L592.3 361.9L592.3 361.5L592.5 361.4Z"/><path class="iso-shade" data-shade="1" d="M592.3 361.9L592.1 362L592.1 361.6L592.3 361.5ZM592.1 362L591.8 362L591.8 361.6L592.1 361.6Z"/><path class="iso-shade" data-shade="2" d="M591.8 362L591.5 362L591.5 361.6L591.8 361.6Z"/><path class="iso-shade" data-shade="3" d="M591.5 362L591.2 361.9L591.2 361.5L591.5 361.6ZM591.2 361.9L591.1 361.7L591.1 361.3L591.2 361.5ZM591.1 361.7L591 361.6L591 361.2L591.1 361.3Z"/><path class="iso-top" d="M591.3 360.9L591.6 360.8L591.9 360.8L592.2 360.9L592.4 361L592.6 361.1L592.6 361.3L592.5 361.4L592.3 361.5L592.1 361.6L591.8 361.6L591.5 361.6L591.2 361.5L591.1 361.3L591 361.2L591.1 361Z"/><path class="iso-line iso-edge" data-tone="hi" d="M591 361.2L591.1 361L591.3 360.9L591.6 360.8L591.9 360.8L592.2 360.9L592.4 361L592.6 361.1L592.6 361.3M592.6 361.6L592.5 361.8L592.3 361.9L592.1 362L591.8 362L591.5 362L591.2 361.9L591.1 361.7L591 361.6M592.6 361.3L592.6 361.6M591 361.2L591 361.6"/></g></svg></div></div><div class="oms-controls">

  </div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>三座后排与顶置横梁</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>OMS 镜头与红外补光</span><span class="iso-key"><svg class="iso-swatch" data-mark="green" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>座位区域及示意视场</span></span><span class="iso-caption">在三个座位区域间移动一个已指定的教学样本。右下状态屏显示座位关联、遮挡不确定性和输入有效性；它不代表量产感知输出。</span></figcaption></figure></main><script type="module">const DATA = {"GEOMETRY":{"cabin":{"lengthMm":5600,"widthMm":4200,"floorZmm":190},"base":{"xMm":-3200,"yMm":-3000,"widthMm":6400,"depthMm":6000},"seat":{"centerXmm":-100,"widthMm":820,"depthMm":850,"cushionTopZmm":650,"adultHeadZmm":1710,"childHeadZmm":1260},"zones":[{"id":"left","label":"左座","code":"L2","xMm":-100,"yMm":-920},{"id":"center","label":"中座","code":"C2","xMm":-100,"yMm":0},{"id":"right","label":"右座","code":"R2","xMm":-100,"yMm":920}],"sensor":{"xMm":-900,"yMm":0,"zMm":2440,"lensOffsetMm":[0,0,-88],"direction":[0,0,-1]},"exampleRangeMm":{"min":780,"max":1600},"initial":{"zoneId":"center","scenarioId":"adult"}},"SCENARIOS":{"empty":{"label":"空座","detail":"无人样本 · 座位区域有效","status":"EMPTY · INPUT LABEL","occupancy":"empty","object":"none","sensorValid":true},"adult":{"label":"成人乘员","detail":"坐姿乘员 · 按座位关联","status":"OCCUPIED · ADULT LABEL","occupancy":"occupied","object":"adult","sensorValid":true},"childSeat":{"label":"儿童座椅","detail":"儿童约束装置与儿童样本","status":"OCCUPIED · CHILD-SEAT LABEL","occupancy":"occupied","object":"childSeat","sensorValid":true},"object":{"label":"空座有物品","detail":"背包样本 · 与乘员区分","status":"OBJECT · NO PERSON LABEL","occupancy":"empty","object":"bag","sensorValid":true},"occluded":{"label":"毯子遮挡","detail":"部分遮挡 · 保留不确定状态","status":"UNCERTAIN · OCCLUDED LABEL","occupancy":"unknown","object":"blanket","sensorValid":true},"cameraFault":{"label":"相机输入无效","detail":"镜头盖闭合 · 所有座位状态无效","status":"SENSOR INPUT INVALID","occupancy":"invalid","object":"none","sensorValid":false}},"projection":{"origin":[520,343.43213965739125],"scale":0.0893123669072907,"azimuth":220,"elevation":31},"initial":{"zoneId":"center","zoneLabel":"中座","zoneCode":"C2","scenarioId":"adult","scenarioLabel":"成人乘员","status":"OCCUPIED · ADULT LABEL","occupancy":"occupied","object":"adult","sensorValid":true,"sample":[-300,0,1710],"camera":[-900,0,2352],"cameraDistanceMm":878.7286270516057,"insideExampleRange":true,"zoneStates":[{"id":"left","label":"L2","status":"STANDBY","active":false},{"id":"center","label":"C2","status":"OCCUPIED · ADULT LABEL","active":true},{"id":"right","label":"R2","status":"STANDBY","active":false}]}};
const observation = function observation(zoneId, scenarioId, geometry = GEOMETRY, scenarios = SCENARIOS) {
  const zone = geometry.zones.find((item) => item.id === zoneId);
  const scenario = scenarios[scenarioId];
  if (!zone || !scenario) throw new RangeError(`Unknown OMS zone or scenario: ${zoneId}/${scenarioId}`);

  const camera = [
    geometry.sensor.xMm + geometry.sensor.lensOffsetMm[0],
    geometry.sensor.yMm + geometry.sensor.lensOffsetMm[1],
    geometry.sensor.zMm + geometry.sensor.lensOffsetMm[2],
  ];
  const sample = [zone.xMm - 200, zone.yMm, scenario.object === "childSeat" ? geometry.seat.childHeadZmm : geometry.seat.adultHeadZmm];
  const cameraDistanceMm = Math.hypot(camera[0] - sample[0], camera[1] - sample[1], camera[2] - sample[2]);
  const zoneStates = geometry.zones.map((item) => ({
    id: item.id,
    label: item.code,
    status: scenario.sensorValid ? (item.id === zoneId ? scenario.status : "STANDBY") : "INPUT INVALID",
    active: item.id === zoneId,
  }));

  return {
    zoneId,
    zoneLabel: zone.label,
    zoneCode: zone.code,
    scenarioId,
    scenarioLabel: scenario.label,
    status: scenario.status,
    occupancy: scenario.occupancy,
    object: scenario.object,
    sensorValid: scenario.sensorValid,
    sample,
    camera,
    cameraDistanceMm,
    insideExampleRange: cameraDistanceMm >= geometry.exampleRangeMm.min && cameraDistanceMm <= geometry.exampleRangeMm.max,
    zoneStates,
  };
};
const stage = document.querySelector(".oms-stage");
const sampleParts = [...stage.querySelectorAll(".oms-sample")];
const scenarioButtons = [...document.querySelectorAll("[data-scenario]")];
const zoneButtons = [...document.querySelectorAll("[data-zone]")];
const cover = stage.querySelector(".oms-camera-cover");
const distanceOutput = document.querySelector("#camera-distance");
const cameraContext = document.querySelector("#camera-context");
const plateReadout = document.querySelector("[data-readout]");
const resetButton = document.querySelector("#reset-model");
const cameraLed = stage.querySelector(".oms-status-solid");
const reduced = matchMedia("(prefers-reduced-motion: reduce)");
const project = ([x, y, z]) => {
  const { origin, scale, azimuth, elevation } = DATA.projection;
  const radians = Math.PI / 180;
  const sinA = Math.sin(azimuth * radians);
  const cosA = Math.cos(azimuth * radians);
  const sinE = Math.sin(elevation * radians);
  const cosE = Math.cos(elevation * radians);
  const k = scale * Math.sqrt(1.6);
  return [
    origin[0] + (x * sinA - y * cosA) * k,
    origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k,
  ];
};

let zoneId = DATA.GEOMETRY.initial.zoneId;
let scenarioId = DATA.GEOMETRY.initial.scenarioId;
let currentY = DATA.GEOMETRY.zones.find((zone) => zone.id === zoneId).yMm;
let startY = currentY;
let targetY = currentY;
let animationStart = 0;
let frame = 0;
let visible = false;

function translateSamples(yMm) {
  const origin = project([0, 0, 0]);
  const destination = project([0, yMm, 0]);
  const transform = `translate(${(destination[0] - origin[0]).toFixed(2)} ${(destination[1] - origin[1]).toFixed(2)})`;
  sampleParts.forEach((element) => element.setAttribute("transform", transform));
}

function updateScreen(state) {
  state.zoneStates.forEach((zone) => {
    const row = stage.querySelector(`[data-screen-row="${zone.id}"]`);
    const status = stage.querySelector(`[data-screen-status="${zone.id}"]`);
    const valid = stage.querySelector(`[data-screen-valid="${zone.id}"]`);
    const marker = stage.querySelector(`[data-zone-marker="${zone.id}"]`);
    if (row) {
      row.classList.toggle("is-active", zone.active);
      row.classList.toggle("is-invalid", zone.status === "INPUT INVALID");
      row.classList.toggle("is-uncertain", zone.active && state.scenarioId === "occluded");
    }
    if (status) status.textContent = zone.status;
    if (valid) valid.textContent = state.sensorValid ? "YES" : "NO";
    if (marker) marker.classList.toggle("is-active", zone.active && state.sensorValid);
    stage.querySelectorAll(`.oms-zone-boundary.oms-zone-${zone.id}`).forEach((element) => {
      element.classList.toggle("is-active", zone.active && state.sensorValid);
      element.classList.toggle("is-invalid", !state.sensorValid);
    });
    stage.querySelectorAll(`.oms-view-${zone.id}`).forEach((element) => {
      element.classList.toggle("is-active", zone.active && state.sensorValid);
      element.classList.toggle("is-invalid", !state.sensorValid);
    });
    stage.querySelectorAll(`.oms-zone-${zone.id}.zone-marker`).forEach((element) => {
      element.classList.toggle("is-invalid", !state.sensorValid);
    });
  });
}

function paint() {
  const state = observation(zoneId, scenarioId, DATA.GEOMETRY, DATA.SCENARIOS);
  stage.dataset.scenario = scenarioId;
  stage.dataset.zone = zoneId;
  scenarioButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.scenario === scenarioId)));
  zoneButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.zone === zoneId)));
  sampleParts.forEach((element) => {
    const visibleForScenario = state.object !== "none" && element.dataset.scenarioObject === state.object;
    element.hidden = !visibleForScenario;
  });
  cover.hidden = state.sensorValid;
  cameraLed.classList.toggle("is-invalid", !state.sensorValid);
  updateScreen(state);

  const distance = `${(state.cameraDistanceMm / 1000).toFixed(2)} m`;
  distanceOutput.textContent = distance;
  cameraContext.textContent = state.sensorValid
    ? state.scenarioId === "occluded"
      ? "部分遮挡 · 保留不确定标签"
      : "教学几何距离 · 非产品阈值"
    : "镜头盖闭合 · 三席输入无效";
  plateReadout.textContent = `${state.zoneCode} · ${state.status} · ${distance}`;
  translateSamples(currentY);
}

function finishMotion() {
  currentY = targetY;
  frame = 0;
  paint();
}

function tick(now) {
  const progress = Math.min(1, (now - animationStart) / 780);
  const eased = 1 - Math.pow(1 - progress, 3);
  currentY = startY + (targetY - startY) * eased;
  paint();
  if (progress < 1 && visible && !reduced.matches) frame = requestAnimationFrame(tick);
  else finishMotion();
}

function moveToZone(nextZoneId) {
  if (!DATA.GEOMETRY.zones.some((zone) => zone.id === nextZoneId)) return;
  zoneId = nextZoneId;
  startY = currentY;
  targetY = DATA.GEOMETRY.zones.find((zone) => zone.id === zoneId).yMm;
  if (frame) cancelAnimationFrame(frame);
  frame = 0;
  if (reduced.matches || !visible || Math.abs(targetY - startY) < 0.1) {
    currentY = targetY;
    paint();
    return;
  }
  animationStart = performance.now();
  frame = requestAnimationFrame(tick);
  paint();
}

function setScenario(nextScenarioId) {
  if (!DATA.SCENARIOS[nextScenarioId]) return;
  scenarioId = nextScenarioId;
  paint();
}

scenarioButtons.forEach((button) => button.addEventListener("click", () => setScenario(button.dataset.scenario)));
zoneButtons.forEach((button) => button.addEventListener("click", () => moveToZone(button.dataset.zone)));
resetButton.addEventListener("click", () => {
  scenarioId = DATA.GEOMETRY.initial.scenarioId;
  moveToZone(DATA.GEOMETRY.initial.zoneId);
});

reduced.addEventListener?.("change", () => {
  if (reduced.matches && frame) {
    cancelAnimationFrame(frame);
    finishMotion();
  }
});

if ("IntersectionObserver" in window) {
  new IntersectionObserver((entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (!visible && frame) {
      cancelAnimationFrame(frame);
      finishMotion();
    }
  }, { rootMargin: "100px 0px" }).observe(stage);
} else {
  visible = true;
}

paint();

window.__omsCabin = {
  setZone: moveToZone,
  setScenario,
  get state() { return observation(zoneId, scenarioId, DATA.GEOMETRY, DATA.SCENARIOS); },
};
